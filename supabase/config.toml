# Supabase-CLI-Konfiguration (Projekt: xfprvshhexhzhfgkfxpi, Region Frankfurt)
project_id = "wer-liefert"

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.analyse]
# Die App ruft die Funktion ohne Login auf; geschützt wird sie durch
# Eingabeprüfung und Rate-Limit pro Sitzung.
verify_jwt = false

[functions.pruefung]
# Eingeladene Prüfende haben kein Konto; Zugang nur mit persönlichem Token
# (geprüft über den SHA-256-Hash in pruef_einladungen).
verify_jwt = false

[functions.vorschlag]
# Themenvorschläge ohne Login und ohne KI; geschützt durch Eingabeprüfung,
# Wortfilter und Rate-Limit pro Sitzung.
verify_jwt = false
