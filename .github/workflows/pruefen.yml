name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für den Vergleich der IDs mit dem Zielzweig
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Datenkatalog prüfen
        run: npm run daten:pruefen
      - name: Quizfragen aktuell (public/quiz/fragen.json)
        run: npm run quiz:erzeugen -- --pruefen
      - name: IDs, neue Ursachen und Blindwerte gegen den Zielzweig
        if: github.event_name == 'pull_request'
        env:
          ZIEL: origin/${{ github.base_ref }}
        run: npm run daten:id -- --gegen "$ZIEL"
      - run: npm run lint
      - name: Typen prüfen (App, Vite-Konfiguration, Skripte und Tests)
        run: npm run typen
      - run: npm test
      - run: npm run build
